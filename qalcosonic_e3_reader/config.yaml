name: "Qalcosonic E3 Wärmezähler"
version: "1.0.0"
slug: "qalcosonic_e3_reader"
description: "Liest den Zählerstand eines Qalcosonic E3 Wärmezählers über einen IR-Lesekopf aus und veröffentlicht ihn per MQTT in Home Assistant"
url: ""
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
init: false
startup: services
boot: auto
hassio_api: false
homeassistant_api: false

# Zugriff auf USB-/Seriell-Geräte (IR-Lesekopf hängt i.d.R. als USB-Seriell-Adapter am Host)
usb: true
uart: true
full_access: true

options:
  serial_port: "/dev/ttyUSB0"
  poll_interval: 300
  mqtt_host: "core-mosquitto"
  mqtt_port: 1883
  mqtt_user: "Steffen"
  mqtt_password: "!Steffe75"
  mqtt_topic_prefix: "qalcosonic_e3"
  device_name: "Wärmezähler"
  log_level: "info"

schema:
  serial_port: str
  poll_interval: int(30,86400)
  mqtt_host: str
  mqtt_port: port
  mqtt_user: str
  mqtt_password: password
  mqtt_topic_prefix: str
  device_name: str
  log_level: list(debug|info|warning|error)
